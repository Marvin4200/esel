<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esel – eselbande.com</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.14);
      --text: #e2e8f0;
      --muted: #4a5568;
      --accent: #818cf8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(102,126,234,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(240,147,251,0.07) 0%, transparent 55%);
    }

    /* Nav */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 2rem;
      background: rgba(8,8,16,0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { font-weight: 700; font-size: 0.95rem; text-decoration: none; color: var(--text); }
    .nav-links { display: flex; gap: 0.5rem; }
    .nav-link {
      padding: 0.3rem 0.8rem; border-radius: 7px; font-size: 0.78rem;
      font-weight: 600; text-decoration: none; color: var(--muted);
      border: 1px solid var(--border); transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--text); border-color: var(--border2); }

    /* Main */
    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.5rem; max-width: 600px; width: 100%; text-align: center;
    }

    .title {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #f093fb);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    /* Image box */
    .esel-box {
      width: 100%; max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      min-height: 300px;
      display: flex; align-items: center; justify-content: center;
    }
    .esel-img {
      width: 100%; max-height: 420px;
      object-fit: contain;
      display: block;
    }
    .esel-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; background: var(--surface);
    }

    /* Caption */
    .caption {
      font-size: 1rem; font-weight: 600; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem 1.2rem;
      font-style: italic;
    }

    /* Counter */
    .counter { font-size: 0.8rem; color: var(--muted); }

    /* Button */
    .btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px;
      color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, filter 0.15s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:active { transform: scale(0.97); }

    @media (max-width: 500px) {
      .topnav { padding: 0.6rem 1rem; }
      .title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="nav-brand" href="https://eselbande.com">🫏 eselbande.com</a>
  <div class="nav-links">
    <a class="nav-link" href="https://team.eselbande.com">👥 Team</a>
    <a class="nav-link" href="https://status.eselbande.com">📡 Status</a>
  </div>
</nav>

<div class="container">
  <div>
    <div class="title">🫏 Esel des Tages</div>
    <div class="subtitle">Täglich frisch. Täglich dümmer.</div>
  </div>

  <div class="esel-box" id="esel-box">
    <div class="esel-loading" id="loading">🫏</div>
    <img class="esel-img" id="esel-img" src="" alt="Esel" style="display:none"
      onload="imgLoaded()" onerror="imgError()">
  </div>

  <div class="caption" id="caption">Lädt...</div>

  <button class="btn" onclick="nextEsel()">🫏 Neuer Esel</button>

  <div class="counter" id="counter"></div>
</div>

<script>
const ESEL = [
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Donkey_in_Clovelly%2C_North_Devon%2C_England.jpg/640px-Donkey_in_Clovelly%2C_North_Devon%2C_England.jpg', caption: '"Ich bin hier der Chef."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Donkey_1_arp_750px.jpg/640px-Donkey_1_arp_750px.jpg', caption: '"Was guckst du?"' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Equus_africanus_asinus_2005.jpg/640px-Equus_africanus_asinus_2005.jpg', caption: '"Ich höre alles. Alles."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Two_donkeys_2012.jpg/640px-Two_donkeys_2012.jpg', caption: '"Wir sind ein Team. Meistens."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Donkey_Equus_asinus.jpg/640px-Donkey_Equus_asinus.jpg', caption: '"Ich muss da kurz drüber nachdenken."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Donkey_in_Jordan.jpg/640px-Donkey_in_Jordan.jpg', caption: '"Ich bin auf Dienstreise."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Burro%28Equus_asinus%29_04.jpg/640px-Burro%28Equus_asinus%29_04.jpg', caption: '"Fotogen? Ich? Na klar."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Cute_donkey.jpg/640px-Cute_donkey.jpg', caption: '"Ich weiß dass ich süß bin."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Donkey_in_Santorini.jpg/640px-Donkey_in_Santorini.jpg', caption: '"Griechenland? Ja, war okay."' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Baby_donkey_%28Equus_asinus%29_at_the_Honolulu_Zoo.jpg/640px-Baby_donkey_%28Equus_asinus%29_at_the_Honolulu_Zoo.jpg', caption: '"Ich bin neu hier."' },
];

let current = -1;
let views = parseInt(localStorage.getItem('esel_views') || '0');

function nextEsel() {
  let next;
  do { next = Math.floor(Math.random() * ESEL.length); } while (next === current && ESEL.length > 1);
  current = next;

  const img = document.getElementById('esel-img');
  const loading = document.getElementById('loading');
  img.style.display = 'none';
  loading.style.display = 'flex';
  document.getElementById('caption').textContent = 'Lädt...';

  img.src = ESEL[current].url;
  views++;
  localStorage.setItem('esel_views', views);
  document.getElementById('counter').textContent = `Du hast schon ${views} Esel gesehen.`;
}

function imgLoaded() {
  errorCount = 0;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('esel-img').style.display = 'block';
  document.getElementById('caption').textContent = ESEL[current].caption;
}

let errorCount = 0;
function imgError() {
  errorCount++;
  if (errorCount < ESEL.length) {
    nextEsel();
  } else {
    document.getElementById('loading').textContent = '🫏 Kein Esel gefunden.';
    document.getElementById('caption').textContent = 'Der Esel ist weg.';
  }
}

nextEsel();
document.getElementById('counter').textContent = `Du hast schon ${views} Esel gesehen.`;
</script>

</body>
</html>
