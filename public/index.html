<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esel – eselbande.com</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.14);
      --text: #e2e8f0;
      --muted: #4a5568;
      --accent: #818cf8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(102,126,234,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(240,147,251,0.07) 0%, transparent 55%);
    }

    /* Nav */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 2rem;
      background: rgba(8,8,16,0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { font-weight: 700; font-size: 0.95rem; text-decoration: none; color: var(--text); }
    .nav-links { display: flex; gap: 0.5rem; }
    .nav-link {
      padding: 0.3rem 0.8rem; border-radius: 7px; font-size: 0.78rem;
      font-weight: 600; text-decoration: none; color: var(--muted);
      border: 1px solid var(--border); transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--text); border-color: var(--border2); }

    /* Main */
    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.5rem; max-width: 600px; width: 100%; text-align: center;
    }

    .title {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #f093fb);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    /* Image box */
    .esel-box {
      width: 100%; max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      min-height: 300px;
      display: flex; align-items: center; justify-content: center;
    }
    .esel-img {
      width: 100%; max-height: 420px;
      object-fit: contain;
      display: block;
    }
    .esel-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; background: var(--surface);
    }

    /* Caption */
    .caption {
      font-size: 1rem; font-weight: 600; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem 1.2rem;
      font-style: italic;
    }

    /* Counter */
    .counter { font-size: 0.8rem; color: var(--muted); }

    /* Button */
    .btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px;
      color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, filter 0.15s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:active { transform: scale(0.97); }

    @media (max-width: 500px) {
      .topnav { padding: 0.6rem 1rem; }
      .title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="nav-brand" href="https://eselbande.com">🫏 eselbande.com</a>
  <div class="nav-links">
    <a class="nav-link" href="https://team.eselbande.com">👥 Team</a>
    <a class="nav-link" href="https://status.eselbande.com">📡 Status</a>
  </div>
</nav>

<div class="container">
  <div>
    <div class="title">🫏 Esel des Tages</div>
    <div class="subtitle">Täglich frisch. Täglich dümmer.</div>
  </div>

  <div class="esel-box" id="esel-box">
    <div class="esel-loading" id="loading">🫏</div>
    <img class="esel-img" id="esel-img" src="" alt="Esel" style="display:none"
      onload="imgLoaded()" onerror="imgError()">
  </div>

  <div class="caption" id="caption">Lädt...</div>

  <button class="btn" onclick="nextEsel()">🫏 Neuer Esel</button>

  <div class="counter" id="counter"></div>
</div>

<script>
const ESEL = [
  { url: 'https://media.giphy.com/media/3oEjI789af0AVkGLmE/giphy.gif',    caption: '"Ich bin kein Esel, ich bin ein Drache."' },
  { url: 'https://media.giphy.com/media/f8CUvDtx5XkgM/giphy.gif',         caption: '"In the morning, I\'m makin\' waffles!"' },
  { url: 'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',     caption: '"Hallooo! Hast du mich vergessen?"' },
  { url: 'https://media.giphy.com/media/xT9IgG50Lg7russbGM/giphy.gif',    caption: '"Pick me! Pick me!"' },
  { url: 'https://media.giphy.com/media/26FL8CZeERaT0G8Le/giphy.gif',     caption: '"Das war mein Gesicht."' },
  { url: 'https://media.giphy.com/media/xT9IgHqHKn2qJCMaXK/giphy.gif',   caption: '"Ich bin ein Esel. Ich hab einen Traum."' },
  { url: 'https://media.giphy.com/media/3o7btZ1Gm7ZL25pLMs/giphy.gif',   caption: '"Bestens. Alles bestens."' },
  { url: 'https://media.giphy.com/media/l4FGuhL4U2WyjdkaY/giphy.gif',    caption: '"Freunde! Habt ihr das gesehen?!"' },
  { url: 'https://media.giphy.com/media/xT9IgDEI1iZANbKcTm/giphy.gif',   caption: '"Weißt du was? Ich bin auch dabei."' },
  { url: 'https://media.giphy.com/media/CaiVJuZGvR8HK/giphy.gif',        caption: '"Was machst du da? Ich mach das auch."' },
];

let current = -1;
let views = parseInt(localStorage.getItem('esel_views') || '0');

function nextEsel() {
  let next;
  do { next = Math.floor(Math.random() * ESEL.length); } while (next === current && ESEL.length > 1);
  current = next;

  const img = document.getElementById('esel-img');
  const loading = document.getElementById('loading');
  img.style.display = 'none';
  loading.style.display = 'flex';
  document.getElementById('caption').textContent = 'Lädt...';

  img.src = ESEL[current].url;
  views++;
  localStorage.setItem('esel_views', views);
  document.getElementById('counter').textContent = `Du hast schon ${views} Esel gesehen.`;
}

function imgLoaded() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('esel-img').style.display = 'block';
  document.getElementById('caption').textContent = ESEL[current].caption;
}

function imgError() {
  // Skip broken image, try another
  nextEsel();
}

nextEsel();
document.getElementById('counter').textContent = `Du hast schon ${views} Esel gesehen.`;
</script>

</body>
</html>
